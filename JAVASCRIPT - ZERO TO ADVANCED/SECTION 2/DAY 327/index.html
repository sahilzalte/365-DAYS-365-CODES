<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email & Password Validator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form autocomplete="off" class="container">
        <h2>Email & Password Validator</h2>

        <div class="input-group">
            <label>Email</label>
            <input type="text" id="email" placeholder="Enter your email" />
            <p class="error" id="emailError">Invalid Email</p>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" />
            <p class="error" id="passError">Invalid Password</p>
        </div>

        <button class="btn" id="submitBtn">Validate</button>
    </form>

    <!-- JS will be written by you -->
<script src="script.js"></script>
</body>

</html>
